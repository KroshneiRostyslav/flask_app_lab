<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>{% block title %} {% endblock %}</title>
</head>

<body>
    <nav>
        <h1 class="top_page">Flask Application</h1>

        <ul>
            <li><a class="nav_link" href="{{ url_for('users.greetings', name='Jonh')}}"> Greet Jonh </a></li>
            <li><a class="nav_link" href="{{ url_for('users.admin')}}"> Admin </a></li>
            <li><a class="nav_link" href="{{ url_for('products.products')}}"> Products </a></li>
            <li><a class="nav_link" href="{{ url_for('users.login')}}"> Login </a></li>
            <li><a class="nav_link" href="{{ url_for('users.profile')}}"> Profile </a></li>
        </ul>
    </nav>

    {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span>&times;</span></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="container">
        {% block body %} {% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
