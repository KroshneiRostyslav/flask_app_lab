{% macro render_field(field) %}
    <div class="form-group mb-3">
        {{ field.label(class="form-label mb-3") }} <br>
        {{ field( class="form-control" + (" is-invalid" if field.errors else ""))}}

        {% if field.errors %}
            <div class="invalid-feedback">
                {% for error in field.errors %}
                    <h6 class="">{{ error }}</h6>
                {% endfor %}    
            </div>
        {% endif %}
    </div>
{% endmacro %}
