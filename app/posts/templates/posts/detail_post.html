{% extends 'base.html' %}

{% block title %}
Post
{% endblock %}

{% block content %}

<h1>{{ post.title }}</h1>

<p>{{ post.content }}</p>

<hr>

<p><strong>Author:</strong> {{ post.author }}</p>

<p><strong>Category:</strong> {{ post.category }}</p>

<p><strong>Date:</strong> {{ post.posted }}</p>

<a
    href="{{ url_for('posts.update_post', id=post.id) }}"
    class="btn btn-warning"
>
    Edit
</a>

<a
    href="{{ url_for('posts.delete_post', id=post.id) }}"
    class="btn btn-danger"
>
    Delete
</a>

{% endblock %}
