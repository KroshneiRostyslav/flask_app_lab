{% extends 'base.html' %}

{% block title %}
Delete
{% endblock %}

{% block content %}

<h2>
    Delete "{{ post.title }}" ?
</h2>

<form method="POST">

    <button class="btn btn-danger">
        Confirm Delete
    </button>

    <a
        href="{{ url_for('posts.detail_post', id=post.id) }}"
        class="btn btn-secondary"
    >
        Cancel
    </a>

</form>

{% endblock %}
