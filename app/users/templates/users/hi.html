{% extends "base.html" %}

{% block head %} 
    <title> Greeting Page </title>
{% endblock %}

{% block body %}    
    <h2>Hello, {{name}}</h2>
    {% if age %}
        <p class="green">You are {{age}} years old.</p>
    {% else %}
        <p class="red">Age is unknown</p>
    {% endif %}
{%endblock%}
