{% extends "base.html" %}
{% from "_form_macros.html" import render_field %}

{% block head %}
    <title>Login</title>
{% endblock %}

{% block body %}    
    <h2 class="text-center">Login</h2>
    
    <form method="post" novalidate>
        {{form.csrf_token}}

        {{render_field(form.username)}}
        {{render_field(form.password)}}
        {{render_field(form.remember)}}

        {{form.submit()}}
    </form>
{%endblock%}
